name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: restaurant-finder/package-lock.json

      - name: Install dependencies
        working-directory: restaurant-finder
        run: npm ci

      - name: TypeScript check
        working-directory: restaurant-finder
        run: npm run build

      - name: Run tests
        working-directory: restaurant-finder
        run: npm run test:run

      - name: Run tests with coverage
        working-directory: restaurant-finder
        run: npm run test:coverage
